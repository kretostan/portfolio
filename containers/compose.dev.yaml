services:
  frontend:
    build:
      context: ..
      dockerfile: containers/Dockerfile.frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PNPM_HOME=/pnpm-store
      - VITE_API_URL=http://backend:3001
    volumes:
      - ../:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - backend_node_modules:/app/backend/node_modules
      - pnpm_global_store:/pnpm-store

  backend:
    build:
      context: ..
      dockerfile: containers/Dockerfile.backend
      target: dev
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ../backend/.env.dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PNPM_HOME=/pnpm-store
    volumes:
      - ../:/app
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - backend_node_modules:/app/backend/node_modules
      - pnpm_global_store:/pnpm-store
      # DOdać health check? TODO:
      # i Ogarnąć woluminy? TODO poniżej

volumes:
  root_node_modules:
  frontend_node_modules:
  backend_node_modules:
  pnpm_global_store:

# TODO: Ogarnąć czy nie zostawiam za dużo niepotrzebnych danych - kontenery dużo zajmują
