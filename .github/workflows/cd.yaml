name: CD Pipeline

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve image SHA
        id: version
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.sha }}
          persist-credentials: false

      - name: Set image SHA
        env:
          IMAGE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          sed -i "s|__IMAGE_SHA__|$IMAGE_SHA|g" \
            containers/quadlet/*.container

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "containers/quadlet/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 2
          overwrite: true

      - name: Deploy via SSH (Podman)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -eu
            systemctl --user daemon-reload
            systemctl --user restart \
              portfolio-backend.service \
              portfolio-frontend.service
