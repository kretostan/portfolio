name: CI Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm and setup Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend
        run: pnpm --filter backend exec biome ci .

      - name: Check frontend
        run: pnpm --filter frontend exec biome ci .

  compile:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm and setup Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.project }}
        if: matrix.project == 'frontend'
        run: pnpm --filter ${{ matrix.project }} build

      - name: Build ${{ matrix.project }}
        if: matrix.project == 'backend'
        run: pnpm --filter ${{ matrix.project }} build

  build-and-push:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint, compile]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile.backend
          push: true
          tags: ghcr.io/kretostan/portfolio/backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile.frontend
          push: true
          tags: ghcr.io/kretostan/portfolio/frontend:${{ github.sha }}

      - name: Docker Smoke Test (inline)
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker compose -p portfolio -f containers/compose.yaml -f containers/compose.ci.yaml up -d --wait --wait-timeout 90
          curl --fail --max-time 5 http://localhost:8080/api/skills

      - name: Clean up
        if: always()
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: docker compose -p portfolio -f containers/compose.yaml -f containers/compose.ci.yaml down
